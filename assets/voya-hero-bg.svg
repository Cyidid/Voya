<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none">
  <defs>
    <!-- Main dark base -->
    <linearGradient id="base" x1="0" y1="0" x2="1440" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0806"/>
      <stop offset="50%" stop-color="#120F0A"/>
      <stop offset="100%" stop-color="#0E0B07"/>
    </linearGradient>
    <!-- Copper glow left -->
    <radialGradient id="glow1" cx="20%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#C4854A" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#C4854A" stop-opacity="0"/>
    </radialGradient>
    <!-- Warm amber glow right -->
    <radialGradient id="glow2" cx="82%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#D4A264" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#D4A264" stop-opacity="0"/>
    </radialGradient>
    <!-- Deep center glow -->
    <radialGradient id="glow3" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#1E1510" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0A0806" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <!-- Base background -->
  <rect width="1440" height="900" fill="url(#base)"/>
  <!-- Copper glow overlays -->
  <rect width="1440" height="900" fill="url(#glow1)"/>
  <rect width="1440" height="900" fill="url(#glow2)"/>
  <!-- Subtle grid lines -->
  <g stroke="#C4854A" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="150" x2="1440" y2="150"/>
    <line x1="0" y1="300" x2="1440" y2="300"/>
    <line x1="0" y1="450" x2="1440" y2="450"/>
    <line x1="0" y1="600" x2="1440" y2="600"/>
    <line x1="0" y1="750" x2="1440" y2="750"/>
    <line x1="240" y1="0" x2="240" y2="900"/>
    <line x1="480" y1="0" x2="480" y2="900"/>
    <line x1="720" y1="0" x2="720" y2="900"/>
    <line x1="960" y1="0" x2="960" y2="900"/>
    <line x1="1200" y1="0" x2="1200" y2="900"/>
  </g>
  <!-- Diagonal accent lines -->
  <g stroke="#C4854A" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="900" x2="900" y2="0"/>
    <line x1="200" y1="900" x2="1100" y2="0"/>
    <line x1="540" y1="900" x2="1440" y2="0"/>
  </g>
  <!-- Large compass rose (decorative, far right) -->
  <g transform="translate(1160 480)" opacity="0.06">
    <circle r="200" stroke="#C4854A" stroke-width="2" fill="none"/>
    <circle r="160" stroke="#C4854A" stroke-width="1" fill="none"/>
    <line x1="0" y1="-200" x2="0" y2="200" stroke="#C4854A" stroke-width="1.5"/>
    <line x1="-200" y1="0" x2="200" y2="0" stroke="#C4854A" stroke-width="1.5"/>
    <line x1="-141" y1="-141" x2="141" y2="141" stroke="#C4854A" stroke-width="0.8"/>
    <line x1="141" y1="-141" x2="-141" y2="141" stroke="#C4854A" stroke-width="0.8"/>
    <polygon points="0,-200 12,-30 0,0 -12,-30" fill="#C4854A"/>
  </g>
  <!-- Small compass rose (left area) -->
  <g transform="translate(160 220)" opacity="0.08">
    <circle r="80" stroke="#C4854A" stroke-width="1.5" fill="none"/>
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#C4854A" stroke-width="1"/>
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#C4854A" stroke-width="1"/>
    <polygon points="0,-80 5,-12 0,0 -5,-12" fill="#C4854A"/>
  </g>
  <!-- Subtle vignette overlay -->
  <radialGradient id="vig" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
  </radialGradient>
  <rect width="1440" height="900" fill="url(#vig)"/>
</svg>
